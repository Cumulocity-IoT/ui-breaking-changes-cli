name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack tarball
        run: |
          pnpm pack
          mv *.tgz c8y-breaking-changes-cli-${{ github.ref_name }}.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: c8y-breaking-changes-cli-${{ github.ref_name }}.tgz
          generate_release_notes: true
